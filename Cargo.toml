[workspace]
members = [
    "crates/shared",
    "server",
    "client",
    "bot",
    "tools",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
rust-version = "1.70"

[workspace.dependencies]
postcard = { version = "1.1", features = ["alloc"] }
serde = { version = "1.0", features = ["derive"] }
